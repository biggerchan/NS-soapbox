<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>肥皂箱｜管理後台 3.3</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/nice33.css"></head>
<body class="admin-dark"><header class="top"><div class="container nav"><a class="brand" href="/">NICE BOX · 返回網站</a><strong>管理後台 3.3</strong></div></header>
<main class="container admin-main">
<h1>內容與網站管理</h1><p class="fine">管理員使用帳號 admin 與 Railway 設定的 ADMIN_PASSWORD 認證。若使用共用電腦，結束後請關閉瀏覽器；Basic 認證可能被瀏覽器暫存。</p>
<div class="admin-tabs" role="tablist" aria-label="管理區域"><button class="admin-tab selected" data-tab="site" type="button">首頁文字</button><button class="admin-tab" data-tab="announcements" type="button">公告管理</button><button class="admin-tab" data-tab="posts" type="button">文章管理</button><button class="admin-tab" data-tab="comments" type="button">留言管理</button><button class="admin-tab" data-tab="reports" type="button">檢舉管理</button></div>
<section class="admin-panel" id="panel-site"><h2>修改網站首頁文字</h2><p class="fine">儲存後所有訪客重新開啟頁面即可看到，不必修改 GitHub。匿名提醒與安全說明固定保留。</p><form id="siteForm"><div id="siteFields" class="admin-form-grid"></div><div class="admin-controls"><button class="primary" type="submit">儲存首頁文字</button></div></form></section>
<section class="admin-panel" id="panel-announcements" hidden><h2>官方公告管理</h2><form id="announcementForm"><label>標題<input id="announcementTitle" maxlength="100" required></label><label>內容<textarea id="announcementBody" maxlength="1500" required rows="5"></textarea></label><label><input id="announcementPinned" type="checkbox"> 重要公告置頂</label><div class="admin-controls"><button class="primary" type="submit">儲存公告</button><button id="announcementCancel" class="ghost" type="button">取消編輯</button></div></form><div id="adminAnnouncements" class="admin-list"></div></section><section class="admin-panel" id="panel-posts" hidden><div class="admin-section-head"><div><h2>所有文章</h2><p class="fine">包含公開與已隱藏文章。刪除為永久刪除，也會刪掉該篇留言。</p></div><button class="ghost" data-refresh="posts">重新整理</button></div><div class="admin-tools"><input id="postSearch" aria-label="搜尋" placeholder="搜尋文章標題或內容"><select id="postSort" aria-label="排序"><option value="new">最新優先</option><option value="old">最早優先</option><option value="comments">留言最多</option></select><button class="ghost" id="postClear" hidden>顯示全部</button></div><div id="adminPosts" class="admin-list"></div><div class="pagination"><button class="ghost" id="postPrev">上一頁</button><span id="postPage"></span><button class="ghost" id="postNext">下一頁</button></div></section>
<section class="admin-panel" id="panel-comments" hidden><div class="admin-section-head"><div><h2>所有留言</h2><p class="fine">可單獨隱藏、恢復或永久刪除留言。</p></div><button class="ghost" data-refresh="comments">重新整理</button></div><div class="admin-tools"><input id="commentSearch" aria-label="搜尋" placeholder="搜尋文章標題或內容"><select id="commentSort" aria-label="排序"><option value="new">最新優先</option><option value="old">最早優先</option><option value="comments">留言最多</option></select><button class="ghost" id="commentClear" hidden>顯示全部</button></div><div id="adminComments" class="admin-list"></div><div class="pagination"><button class="ghost" id="commentPrev">上一頁</button><span id="commentPage"></span><button class="ghost" id="commentNext">下一頁</button></div></section>
<section class="admin-panel" id="panel-reports" hidden><div class="admin-section-head"><div><h2>待處理檢舉</h2><p class="fine">沿用第一版的檢舉處理流程。</p></div><button class="ghost" data-refresh="reports">重新整理</button></div><div id="reports" class="admin-list"></div></section>
</main><div id="toast" role="status" aria-live="polite"></div><script src="/admin.js" defer></script></body></html>
